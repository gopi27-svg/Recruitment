<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recruitment Portal | USDC</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --sidebar-bg: #4a148c; --sidebar-text: #e1bee7; --accent: #4a148c; --bg-main: #f3f4f6; --text-main: #1f2937; --border: #e5e7eb; --success: #10b981; --error: #ef4444; }
        * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); margin: 0; display: flex; min-height: 100vh; }
        .sidebar { width: 280px; background: var(--sidebar-bg); color: var(--sidebar-text); padding: 30px 20px; display: flex; flex-direction: column; position: fixed; height: 100vh; overflow-y: auto; z-index: 10; box-shadow: 4px 0 10px rgba(0,0,0,0.1); }
        .logo-container { text-align: center; margin-bottom: 40px; background: white; padding: 15px; border-radius: 12px; }
        .logo { max-width: 100%; height: auto; }
        .nav-step { display: flex; align-items: center; gap: 15px; padding: 16px; margin-bottom: 8px; border-radius: 10px; transition: 0.3s; cursor: pointer; font-size: 15px; font-weight: 500; }
        .nav-step.active { background: rgba(255,255,255,0.2); color: white; border-left: 4px solid #ffffff; }
        .main-content { margin-left: 280px; flex: 1; padding: 40px; display: flex; justify-content: center; }
        .form-card { width: 100%; max-width: 1200px; background: #ffffff; border-radius: 20px; padding: 60px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        h2 { font-size: 24px; font-weight: 700; margin-bottom: 35px; color: #111827; }
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 28px; }
        .full { grid-column: span 2; }
        label { display: block; margin-bottom: 8px; font-size: 13px; color: #4b5563; font-weight: 600; text-transform: uppercase; }
        label::after { content: " *"; color: var(--error); }
        input, select { width: 100%; padding: 14px 16px; border: 1px solid #e5e7eb; border-radius: 8px; font-size: 15px; background: #ffffff; color: #1f2937; }
        input:focus, select:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 4px rgba(74, 20, 140, 0.1); }
        input.error, select.error { border-color: #ef4444; background: #fef2f2; }
        .split-input { display: flex; gap: 15px; } .split-input div { flex: 1; position: relative; }
        .split-input div::after { content: attr(data-label); position: absolute; right: 15px; top: 50%; transform: translateY(-50%); font-size: 12px; color: #9ca3af; font-weight: 700; }
        .upload-zone { border: 2px dashed #d1d5db; padding: 40px; text-align: center; border-radius: 15px; background: #f9fafb; margin-bottom: 40px; cursor: pointer; }
        .upload-zone.error { border-color: var(--error); background: #fff5f5; }
        .matrix-table { width: 100%; border-collapse: separate; border-spacing: 0; border: 1px solid #e5e7eb; border-radius: 12px; overflow: hidden; }
        .matrix-table th { background: #f9fafb; padding: 14px; font-size: 12px; text-align: left; border-bottom: 1px solid #e5e7eb; }
        .matrix-table td { padding: 12px; text-align: center; border-bottom: 1px solid #e5e7eb; }
        .actions { margin-top: 60px; display: flex; justify-content: space-between; padding-top: 30px; border-top: 1px solid #e5e7eb; }
        .btn { padding: 14px 36px; border-radius: 8px; font-weight: 700; cursor: pointer; border: none; font-size: 15px; }
        .btn-next { background: var(--accent); color: white; }
        .btn-back { background: #fff; border: 1px solid #e5e7eb; color: #4b5563; }
        .btn-submit { background: #10b981; color: white; }
        .form-section { display: none; } .form-section.active { display: block; animation: slideUp 0.4s ease-out; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        #success-screen { display: none; text-align: center; padding: 60px 0; }
        .id-badge { background: #ecfdf5; color: #065f46; padding: 12px 24px; border-radius: 50px; font-weight: 700; font-size: 20px; border: 1px solid #6ee7b7; display: inline-block; }
    </style>
</head>
<body>

<div class="sidebar">
    <div class="logo-container"><img src="https://i.postimg.cc/pTJQwfkV/USDC-Logo.png" alt="USDC Logo" class="logo"></div>
    <div class="nav-step active" id="nav1"><span>1. Basic Info</span></div>
    <div class="nav-step" id="nav2"><span>2. Education</span></div>
    <div class="nav-step" id="nav3"><span>3. Experience</span></div>
    <div class="nav-step" id="nav4"><span>4. Requisition</span></div>
    <div class="nav-step" id="nav5"><span>5. Readiness</span></div>
</div>

<div class="main-content">
    <div class="form-card">
        <div id="success-screen">
            <h1 style="color:#10b981">✓ Application Submitted!</h1>
            <div class="id-badge" id="finalIdDisplay">...</div>
            <br><br><button class="btn btn-back" onclick="window.location.reload()">New Application</button>
        </div>

        <form id="recruitmentWizard" novalidate>
            <!-- SECTION 1 -->
            <div class="form-section active" id="sec1">
                <h2>Candidate Basic Information</h2>
                <div class="upload-zone" id="uploadZone" onclick="document.getElementById('resumeUpload').click()">
                    <span style="font-size: 36px; display: block;">📄</span>
                    <span style="font-weight: 700; color: var(--accent);">Upload Resume (PDF)</span>
                    <p id="parsingStatus" style="font-size: 14px; margin-top: 10px;">Required *</p>
                    <input type="file" id="resumeUpload" accept=".pdf" style="display:none" required>
                </div>
                <div class="grid">
                    <div><label>Candidate ID</label><input type="text" id="candidateId" readonly value="Loading..."></div>
                    <div><label>Candidate Full Name</label><input type="text" id="fullName" required></div>
                    <div><label>Gender</label><select id="gender" required><option value="">Select</option><option>Male</option><option>Female</option><option>Other</option></select></div>
                    <div><label>Contact Number</label><input type="text" id="contactNum" required></div>
                    <div><label>Email ID</label><input type="email" id="emailId" required></div>
                    <div><label>Hometown Location</label><input type="text" id="hometown" required></div>
                    <div><label>Current Location</label><input type="text" id="currLocation" required></div>
                    <div><label>Preferred Location</label><select id="prefLoc" required><option value="">Select</option><option>Bangalore</option><option>Mysore</option><option>Hyderabad</option><option>NCR</option><option>Others</option></select></div>
                    <div><label>Relocate?</label><select id="relocate" required><option value="">Select</option><option>Yes</option><option>No</option></select></div>
                    <div><label>Zone</label><select id="zone" required><option value="">Select</option><option>North</option><option>South</option><option>East</option><option>West</option></select></div>
                </div>
                <div class="full" style="margin-top: 30px;">
                    <label>Languages Known</label>
                    <table class="matrix-table">
                        <thead><tr><th>Language</th><th>Read</th><th>Write</th><th>Speak</th></tr></thead>
                        <tbody id="langBody"></tbody>
                    </table>
                </div>
                <div class="actions"><div></div><button type="button" class="btn btn-next" onclick="go(2)">Next</button></div>
            </div>

            <!-- SECTION 2 & 3 (Simplified for brevity, but all fields included) -->
            <div class="form-section" id="sec2">
                <h2>Education</h2>
                <div class="grid">
                    <div class="full"><label>Highest Qualification</label><select id="highestQual" required><option value="">Select</option><option>Undergraduate (UG)</option><option>Postgraduate (PG)</option></select></div>
                    <div><label>College Name</label><input type="text" id="collegeName" required></div>
                    <div><label>University</label><input type="text" id="universityName" required></div>
                    <div><label>Year of Completion</label><input type="text" id="yearCompletion" required></div>
                    <div><label>Academic Gaps?</label><select id="gaps" required><option value="">Select</option><option>No</option><option>Yes</option></select></div>
                    <div><label>UG Degree</label><input type="text" id="ugDegree" required></div>
                    <div><label>PG Degree</label><input type="text" id="pgDegree"></div>
                    <div><label>Specialization</label><input type="text" id="specialization" required></div>
                </div>
                <div class="actions"><button type="button" class="btn btn-back" onclick="go(1)">Back</button><button type="button" class="btn btn-next" onclick="go(3)">Next</button></div>
            </div>

            <div class="form-section" id="sec3">
                <h2>Experience</h2>
                <div class="grid">
                    <div><label>Total Experience (Yrs/Mos)</label><div class="split-input"><div data-label="Y"><input type="number" id="totYears" required></div><div data-label="M"><input type="number" id="totMonths" required></div></div></div>
                    <div><label>Relevant Exp (Yrs/Mos)</label><div class="split-input"><div data-label="Y"><input type="number" id="relYears" required></div><div data-label="M"><input type="number" id="relMonths" required></div></div></div>
                    <div><label>Current Company</label><input type="text" id="currComp" required></div>
                    <div><label>Current Designation</label><input type="text" id="currDesg" required></div>
                    <div><label>Industry</label><select id="industry" required><option value="">Select</option><option>EdTech</option><option>BFSI</option><option>Tech</option><option>Others</option></select></div>
                    <div><label>Current CTC</label><input type="text" id="currCtc" required></div>
                    <div><label>Expected CTC</label><input type="text" id="expCtc" required></div>
                    <div><label>Notice Period (Days)</label><input type="number" id="noticePeriod" required></div>
                    <div><label>Team Size</label><input type="text" id="teamSize" required></div>
                    <div><label>Reason for Change</label><input type="text" id="reasonChange" required></div>
                </div>
                <div class="actions"><button type="button" class="btn btn-back" onclick="go(2)">Back</button><button type="button" class="btn btn-next" onclick="go(4)">Next</button></div>
            </div>

            <!-- SECTION 4 -->
            <div class="form-section" id="sec4">
                <h2>Requisition</h2>
                <div class="grid">
                    <div><label>Department</label><select id="dept" required><option value="">Select</option><option>Inside Sales</option><option>Marketing</option><option>HR</option><option>Technology</option></select></div>
                    <div><label>Role</label><select id="role" required><option value="">Select</option><option>Executive</option><option>Manager</option></select></div>
                    <div><label>Job Level</label><select id="jobLevel" required><option value="">Select</option><option>L1</option><option>L2</option><option>L3</option></select></div>
                    <div><label>Emp Type</label><select id="empType" required><option value="">Select</option><option>Full-time</option><option>Intern</option></select></div>
                    <div><label>Hiring Manager</label><select id="hiringManager" required><option value="">Select</option><option>Mr. Rajesh V</option><option>Mr. Vivek Chandramohan</option></select></div>
                    <div><label>Recruiter</label><select id="recruiter" required><option value="">Select</option><option>Priya</option><option>Nandan Shetty</option></select></div>
                    <div><label>Date Profile Received</label><input type="date" id="profileDate" required></div>
                    <div><label>Source Type</label><select id="sourceType" required><option value="">Select</option><option>Job Portal</option><option>Referral</option></select></div>
                    <div class="full"><label>Source Name</label><input type="text" id="sourceName" required></div>
                </div>
                <div class="actions"><button type="button" class="btn btn-back" onclick="go(3)">Back</button><button type="button" class="btn btn-next" onclick="go(5)">Next</button></div>
            </div>

            <!-- SECTION 5 -->
            <div class="form-section" id="sec5">
                <h2>Readiness</h2>
                <div class="grid">
                    <div><label>Screening Status</label><select id="screenStatus" required><option value="">Select</option><option>Shortlisted</option><option>Hold</option></select></div>
                    <div><label>Interview Ready?</label><select id="interviewReady" required><option value="">Select</option><option>Yes</option><option>No</option></select></div>
                    <div><label>Interview Mode</label><select id="intMode" required><option value="">Select</option><option>Face-to-Face</option><option>Virtual</option></select></div>
                    <div><label>Availability Date</label><input type="date" id="availability" required></div>
                    <div>
                        <label>Resume updated by</label>
                        <select id="resumeUpdatedBy" required>
                            <option value="">Select</option>
                            <option>Sirivanth T S</option>
                            <option>Sumedh Mahesh</option>
                            <option>Unnati S Rao</option>
                            <option>Manish PM</option>
                            <option>Abhay</option>
                            <option>Surya PR</option>
                        </select>
                    </div>
                </div>
                <div class="actions"><button type="button" class="btn btn-back" onclick="go(4)">Back</button><button type="submit" class="btn btn-submit">Submit</button></div>
            </div>
        </form>
    </div>
</div>

<script>
    // 🔴 UPDATE THIS URL EVERY TIME YOU DEPLOY
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycby0YIV3fFI5dtKPj-4Kog7viahCNw7Aj_HFrrIe1S7fwPwnTDdcFJ8745mIAzC6Ff4Y/exec";

    // Setup Languages
    const langs = ["English", "Kannada", "Hindi", "Tamil", "Telugu", "Malayalam", "Others"];
    const lb = document.getElementById('langBody');
    langs.forEach(l => lb.innerHTML+=`<tr><td>${l}</td><td><input type="checkbox" class="lc" data-l="${l}" data-t="R"></td><td><input type="checkbox" class="lc" data-l="${l}" data-t="W"></td><td><input type="checkbox" class="lc" data-l="${l}" data-t="S"></td></tr>`);

    window.onload = async () => {
        try { 
            const res = await fetch(GOOGLE_SCRIPT_URL + "?t=" + Date.now());
            const d = await res.json();
            document.getElementById('candidateId').value = d.id || "USDC-REC-00001"; 
        } catch(e) { document.getElementById('candidateId').value = "Error Loading ID"; }
    };

    function go(s) { 
        if(s > 1 && !validateSection(`sec${s-1}`)) return;
        document.querySelectorAll('.form-section').forEach(x => x.classList.remove('active'));
        document.getElementById(`sec${s}`).classList.add('active');
        document.querySelectorAll('.nav-step').forEach(n => n.classList.remove('active'));
        document.getElementById(`nav${s}`).classList.add('active');
        window.scrollTo(0,0);
    }

    function validateSection(id) {
        const inputs = document.getElementById(id).querySelectorAll('[required]');
        let valid = true;
        inputs.forEach(i => {
            if(!i.value) { i.classList.add('error'); valid = false; } else { i.classList.remove('error'); }
        });
        if(id === 'sec1' && document.getElementById('resumeUpload').files.length === 0) {
            document.getElementById('uploadZone').classList.add('error'); valid = false;
        }
        return valid;
    }

    // AI PDF PARSING
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';
    document.getElementById('resumeUpload').addEventListener('change', async (e) => {
        const file = e.target.files[0]; if(!file) return;
        const st = document.getElementById('parsingStatus'); st.innerText = "Analyzing Resume...";
        try {
            const buffer = await file.arrayBuffer();
            const pdf = await pdfjsLib.getDocument(buffer).promise;
            let text = "";
            for(let i=1; i<=Math.min(pdf.numPages, 2); i++) {
                const page = await pdf.getPage(i);
                const content = await page.getTextContent();
                text += content.items.map(s => s.str).join(' ');
            }
            const res = await fetch(GOOGLE_SCRIPT_URL, {
                method: "POST", body: JSON.stringify({ action: "parse_resume", text: text })
            });
            const d = await res.json();
            if(d.fullName) {
                document.getElementById('fullName').value = d.fullName || "";
                document.getElementById('emailId').value = d.email || "";
                document.getElementById('contactNum').value = d.phone || "";
                document.getElementById('hometown').value = d.hometown || "";
                document.getElementById('collegeName').value = d.collegeName || "";
                document.getElementById('totYears').value = d.expYears || 0;
                st.innerText = "✓ Auto-filled from PDF"; st.style.color = "green";
            }
        } catch(err) { st.innerText = "Manual fill required"; st.style.color = "red"; }
    });

    // SUBMIT
    document.getElementById('recruitmentWizard').onsubmit = async (e) => {
        e.preventDefault();
        const btn = document.querySelector('.btn-submit'); btn.innerText = "Sending..."; btn.disabled = true;
        const g = i => document.getElementById(i).value;
        const f = document.getElementById('resumeUpload').files[0];
        const reader = new FileReader();
        reader.readAsDataURL(f);
        reader.onload = async () => {
            let lStr = ""; document.querySelectorAll('.lc:checked').forEach(c => lStr += `${c.dataset.l}(${c.dataset.t}) `);
            const payload = {
                fullName: g('fullName'), gender: g('gender'), contact: g('contactNum'), email: g('emailId'),
                hometown: g('hometown'), currLoc: g('currLocation'), prefLoc: g('prefLoc'), relocate: g('relocate'), zone: g('zone'),
                languages: lStr, highQual: g('highestQual'), ug: g('ugDegree'), pg: g('pgDegree'), spec: g('specialization'),
                college: g('collegeName'), university: g('universityName'), yearComp: g('yearCompletion'), gaps: g('gaps'),
                expTotal: `${g('totYears')}Y ${g('totMonths')}M`, expRel: `${g('relYears')}Y ${g('relMonths')}M`,
                currComp: g('currComp'), currDesg: g('currDesg'), industry: g('industry'), teamSize: g('teamSize'), reason: g('reasonChange'),
                currCtc: g('currCtc'), expCtc: g('expCtc'), notice: g('noticePeriod'),
                dept: g('dept'), role: g('role'), jobLevel: g('jobLevel'), empType: g('empType'),
                hm: g('hiringManager'), recruiter: g('recruiter'), profDate: g('profileDate'), srcType: g('sourceType'), srcName: g('sourceName'),
                status: g('screenStatus'), ready: g('interviewReady'), mode: g('intMode'), avail: g('availability'),
                updatedBy: g('resumeUpdatedBy'), // <--- NEW FIELD
                resumeData: reader.result, resumeName: f.name, resumeMimeType: f.type
            };
            try {
                await fetch(GOOGLE_SCRIPT_URL, { method: "POST", body: JSON.stringify(payload) });
                document.getElementById('recruitmentWizard').style.display = 'none';
                document.getElementById('success-screen').style.display = 'block';
                document.getElementById('finalIdDisplay').innerText = g('candidateId');
            } catch(err) { alert("Error saving data"); btn.disabled = false; btn.innerText = "Submit"; }
        };
    };
</script>

</body>
</html>
